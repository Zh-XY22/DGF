[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgf-moirai"
version = "0.2.2"
description = "Complete DGF reference for point and probabilistic forecasting"
requires-python = ">=3.11,<3.13"
dependencies = ["torch>=2.9,<2.10", "numpy~=1.26.0", "lightning==2.4.0", "pytorch-lightning==2.4.0", "torchmetrics==1.4.3", "gluonts~=0.14.3",
 "scipy~=1.11.3", "einops==0.7.*", "jaxtyping~=0.2.24", "python-dotenv==1.0.0",
 "hydra-core==1.3.*", "orjson", "tensorboard", "multiprocess", "huggingface_hub>=0.23,<1",
 "safetensors", "datasets~=2.17.1", "jax[cpu]==0.4.30", "pyarrow==20.0.0", "pandas>=2.1,<2.3"]

[project.scripts]
dgf = "dgf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

